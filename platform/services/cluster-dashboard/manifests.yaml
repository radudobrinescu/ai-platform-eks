# Cluster Dashboard manifests.
#
# Two roles in V2 (after platform-health-agent integration):
#   1. Cluster topology view (existing): polls K8s for nodes/pods/serving endpoints.
#   2. Platform Health Agent approvals UI (new):  reads pending investigations from
#      the `platform_health_agent` postgres database; on click, creates a Remediator
#      Job in the `ai-platform` namespace.
#
# The Platform Health Agent now ships as a COMPONENT of this app — its
# event-watcher, RBAC, config, and scripts live alongside these manifests
# (pha-*.yaml, wired via kustomization.yaml), all in the ai-platform namespace.
# It is always synced but idles gracefully unless a Kiro API key Secret is
# present (see pha-event-watcher.yaml). When idle, the approvals UI auto-disables
# (no investigations in the DB) and the topology view works unchanged.
#
# backend.py is generated from cluster-dashboard/scripts/backend.py by
# kustomize (see kustomization.yaml). Image switched from python:3.12-alpine
# to python:3.12-slim because psycopg[binary] requires glibc, not musl.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-dashboard
  namespace: ai-platform
---
# Existing cluster-wide read access (topology view).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-dashboard
rules:
  # list + watch: the backend keeps watch caches of what it shows.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  # Deployment diagnostics: pod/NodeClaim events (scheduling + Karpenter
  # capacity failures) and pod log tails (model-loading progress).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["kro.run"]
    resources: ["vllmendpoints", "llmdendpoints", "llmddisaggendpoints"]
    verbs: ["list", "watch"]
  # Bedrock models enrolled via `platformctl new-model --source bedrock` are
  # BedrockModel CRs (not litellm-config entries) — list them for the model views.
  - apiGroups: ["bedrock.ai-platform"]
    resources: ["bedrockmodels"]
    verbs: ["list", "watch"]
  # Autoscaling visibility: read the KEDA-managed HPAs (current/desired/min/max +
  # the driving metric value/target) so the dashboard shows per-pool scaling.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # ConfigMap reads are namespaced (litellm-config / node-prices in ai-platform,
  # by name) — granted via the cluster-dashboard-config Role below, NOT here.
  # Keeping configmaps out of this ClusterRole stops the dashboard from reading
  # every ConfigMap in every namespace (kube-system's aws-auth, tenant config…).
  # Read Karpenter NodePools (also the ones with no node, and their limits) and
  # NodeClaims (how far a node got on its way in) for the Infrastructure view.
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools", "nodeclaims"]
    verbs: ["list", "watch"]
  # Read ArgoCD Applications for the Health view's GitOps sync status.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  # Read the shared ALB ingress to discover its hostname for the Quick Links panel.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # Actual node/pod usage from metrics-server for the Infrastructure usage view.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-dashboard
subjects:
  - kind: ServiceAccount
    name: cluster-dashboard
    namespace: ai-platform
roleRef:
  kind: ClusterRole
  name: cluster-dashboard
  apiGroup: rbac.authorization.k8s.io
---
# Namespaced ConfigMap read (ai-platform only): the dashboard fetches
# litellm-config (Bedrock model_list) and node-prices by name from ai-platform.
# Scoped to a Role here instead of the cluster-wide ClusterRole above so it can't
# read ConfigMaps in other namespaces. The one Secret it reads is its own
# read-only LiteLLM key, by name (written by the CronJob at the end of this file).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-dashboard-config
  namespace: ai-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["cluster-dashboard-litellm-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-dashboard-config
  namespace: ai-platform
subjects:
  - kind: ServiceAccount
    name: cluster-dashboard
    namespace: ai-platform
roleRef:
  kind: Role
  name: cluster-dashboard-config
  apiGroup: rbac.authorization.k8s.io
---
# NOTE: the dashboard's Job-creation rights for spawning Remediator Jobs now
# live in pha-rbac.yaml (RoleBinding platform-health-agent-spawner-dashboard),
# since the agent + dashboard share the ai-platform namespace. Keeping all PHA
# RBAC in one file avoids a Role split across two manifests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-dashboard
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-dashboard
  template:
    metadata:
      labels:
        app: cluster-dashboard
      annotations:
        instrumentation.opentelemetry.io/inject-python: "false"
    spec:
      serviceAccountName: cluster-dashboard
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: install-pydeps
          image: python:3.15-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # All Kubernetes data needs these packages, so a failed install
              # (no PyPI access, for example) fails this init container: the
              # kubelet retries it with backoff, the pod is not Ready until
              # it succeeds, and during a rollout the previous pod keeps
              # serving. pip's error is in this container's log. Exact pins
              # only, kept on this line for automated dependency updates.
              pip install --no-cache-dir --target=/pydeps kubernetes==37.0.3 psycopg[binary]==3.3.9 pyyaml==6.0.3 boto3==1.44.10 'pyjwt[crypto]==2.15.1'
          volumeMounts:
            - name: pydeps
              mountPath: /pydeps
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: ["ALL"] }
      containers:
        - name: backend
          image: python:3.15-slim
          command: ["python3", "/app/backend.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # /opt/lib holds the shared `pha` package (agent DB and Job specs).
            - name: PYTHONPATH
              value: /pydeps:/opt/lib
            - name: PYTHONUNBUFFERED
              value: "1"
            # platform-health-agent integration. These are SAFE to set even when the
            # agent is not deployed — backend gracefully reports
            # `approvals_available: false` if the DB is unreachable.
            - name: DB_HOST
              value: platform-db.ai-platform.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: platform_health_agent
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: platform-db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-db-credentials, key: password } }
            - name: PLATFORM_HEALTH_AGENT_NAMESPACE
              value: ai-platform
            # --- Auth for mutating endpoints (approve/dismiss/delete) ---
            # The backend verifies the OIDC ID token oauth2-proxy injects, so a
            # cluster remediation can only be approved by a verified admin — on
            # the ALB path AND the tunnel path. Issuer + client-id come from the
            # same Terraform-managed Secret oauth2-proxy uses. optional: true so
            # the dashboard still serves the read-only topology view if unset;
            # when unset, mutations fail closed unless DASHBOARD_AUTH_REQUIRED is
            # explicitly set to "false" (trusted network / SSO disabled).
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: issuer
                  optional: true
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-id
                  optional: true
            # Only these Cognito groups may APPROVE remediations (stricter than
            # the view, which oauth2-proxy also opens to developers).
            - name: OIDC_ALLOWED_GROUPS
              value: "ai-platform-admins"
            - name: DASHBOARD_AUTH_REQUIRED
              value: "true"
            - name: APPROVAL_EXPIRY_HOURS
              value: "24"
            - name: MAX_REMEDIATIONS_PER_DAY
              value: "20"
            # An investigation Job has a 10-min hard deadline. Past this many minutes
            # an in-flight row is treated as stuck and becomes dismissable in the UI.
            - name: STALE_INVESTIGATION_MINUTES
              value: "15"
            - name: KIRO_MODEL_REMEDIATE
              value: "auto"
            - name: PYTHON_IMAGE
              value: "python:3.12-slim"
            - name: KUBECTL_VERSION
              value: "v1.32.5"
            # Quick Links panel. The ALB-fronted UIs (Open WebUI / LiteLLM /
            # Langfuse) are discovered at runtime from the ingress hostname; only
            # ArgoCD's URL must be injected, from the Terraform-managed
            # cluster-dashboard-links ConfigMap (the EKS capability server_url).
            # optional: true → dashboard still works (ArgoCD link hidden) if unset.
            - name: ARGOCD_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-dashboard-links
                  key: argocdUrl
                  optional: true
            # Cluster name for the dashboard header. Set by Terraform into the
            # same ConfigMap; optional so the header just omits it if unset.
            # (Region is auto-detected from node labels, so it needs no env.)
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cluster-dashboard-links
                  key: clusterName
                  optional: true
            # Public UI URLs when the CloudFront edge is on (set by Terraform).
            # The Quick Links prefer these over the internal-ALB host:port.
            - name: OPEN_WEBUI_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-dashboard-links
                  key: openWebuiUrl
                  optional: true
            - name: LITELLM_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-dashboard-links
                  key: litellmUrl
                  optional: true
            - name: LANGFUSE_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-dashboard-links
                  key: langfuseUrl
                  optional: true
          volumeMounts:
            - name: backend-script
              mountPath: /app
              readOnly: true
            - name: html
              mountPath: /html
              readOnly: true
            - name: fonts
              mountPath: /fonts
              readOnly: true
            - name: pydeps
              mountPath: /pydeps
              readOnly: true
            - name: pha-lib
              mountPath: /opt/lib
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          # live: fails when a data loop stopped or no Kubernetes data arrived
          # for 10 min (a restart fixes both). The live-price loop is
          # excepted: prices are optional, so a stuck lookup only shows in
          # the source status. ready: first Kubernetes list done. Outages of
          # LiteLLM, DCGM, Prometheus or the AWS Price List never fail a
          # probe: they show as source status in the UI.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: backend-script
          configMap:
            name: cluster-dashboard-backend
            items:
              - { key: backend.py, path: backend.py }
              - { key: dashboard____init__.py, path: dashboard/__init__.py }
              - { key: dashboard__api.py, path: dashboard/api.py }
              - { key: dashboard__app.py, path: dashboard/app.py }
              - { key: dashboard__approvals.py, path: dashboard/approvals.py }
              - { key: dashboard__auth.py, path: dashboard/auth.py }
              - { key: dashboard__config.py, path: dashboard/config.py }
              - { key: dashboard__cost.py, path: dashboard/cost.py }
              - { key: dashboard__dcgm.py, path: dashboard/dcgm.py }
              - { key: dashboard__deps.py, path: dashboard/deps.py }
              - { key: dashboard__derive.py, path: dashboard/derive.py }
              - { key: dashboard__k8s.py, path: dashboard/k8s.py }
              - { key: dashboard__litellm.py, path: dashboard/litellm.py }
              - { key: dashboard__models.py, path: dashboard/models.py }
              - { key: dashboard__pricing.py, path: dashboard/pricing.py }
              - { key: dashboard__prom.py, path: dashboard/prom.py }
              - { key: dashboard__snapshot.py, path: dashboard/snapshot.py }
              - { key: dashboard__sources.py, path: dashboard/sources.py }
        - name: html
          configMap:
            name: cluster-dashboard-html
        - name: fonts
          configMap:
            name: cluster-dashboard-fonts
        - name: pydeps
          emptyDir: {}
        # The modules of the shared `pha` package that the dashboard imports,
        # from the hashed backend ConfigMap (not the agent's fixed-name one),
        # so a change to them restarts this pod.
        - name: pha-lib
          configMap:
            name: cluster-dashboard-backend
            items:
              - { key: pha____init__.py, path: pha/__init__.py }
              - { key: pha__db.py, path: pha/db.py }
              - { key: pha__jobs.py, path: pha/jobs.py }
              - { key: pha__log.py, path: pha/log.py }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-dashboard
  namespace: ai-platform
spec:
  selector:
    app: cluster-dashboard
  ports:
    - port: 9090
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-platform-dashboard
  namespace: ai-platform
  annotations:
    alb.ingress.kubernetes.io/group.name: ai-platform
    # scheme: internal (private ALB) — the secure default; must stay IDENTICAL
    # to platform/config/ingress.yaml (shared ALB group "ai-platform"). Reach
    # the UIs via ./platformctl tunnel or the opt-in CloudFront VPC-origin edge.
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 9090}]'
    # Healthcheck hits oauth2-proxy's /ping (the ingress backend is the proxy,
    # not the dashboard directly — see below).
    alb.ingress.kubernetes.io/healthcheck-path: /ping
    # ALB inbound is governed by the Terraform-managed frontend SG. These two
    # annotations must stay IDENTICAL to platform/config/ingress.yaml (shared ALB
    # group "ai-platform") — see that file's header for the why.
    alb.ingress.kubernetes.io/security-groups: ai-platform-alb-inbound
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # SSO gate: route through oauth2-proxy (Cognito), which
                # authenticates + authorizes (admins/developers) and proxies to
                # the dashboard. The dashboard has no native auth, so this is
                # what protects it out of the box. oauth2-proxy ships in this
                # same app (oauth2-proxy.yaml); its config comes from the
                # Terraform-created `oauth2-proxy-secrets` (enable_sso, default on).
                name: oauth2-proxy
                port:
                  number: 4180
---
# Read-only LiteLLM key for the dashboard. Every 15 minutes this CronJob checks
# that Secret cluster-dashboard-litellm-key holds an active key of LiteLLM user
# cluster-dashboard (role proxy_admin_viewer: GET routes only, no model calls)
# and, if not, creates the user and a new key (scripts/litellm_viewer_key.py).
# The master key comes in as an environment variable, so this ServiceAccount
# needs no RBAC on litellm-secrets. Until the first run (up to 15 minutes after
# install) the dashboard shows the LiteLLM sources as "viewer key not created yet".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-dashboard-litellm-key
  namespace: ai-platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-dashboard-litellm-key
  namespace: ai-platform
rules:
  # create is not name-restrictable; get/patch are limited to the key Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["cluster-dashboard-litellm-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-dashboard-litellm-key
  namespace: ai-platform
subjects:
  - kind: ServiceAccount
    name: cluster-dashboard-litellm-key
    namespace: ai-platform
roleRef:
  kind: Role
  name: cluster-dashboard-litellm-key
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-dashboard-litellm-key
  namespace: ai-platform
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            # Not `app: cluster-dashboard`: that is the selector of the dashboard
            # Service, and this pod listens on nothing.
            app: cluster-dashboard-litellm-key
            ai-platform/job: litellm-viewer-key
          annotations:
            instrumentation.opentelemetry.io/inject-python: "false"
        spec:
          restartPolicy: Never
          serviceAccountName: cluster-dashboard-litellm-key
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: viewer-key
              image: python:3.15-slim
              command: ["python3", "/app/litellm_viewer_key.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: LITELLM_MASTER_KEY
                  valueFrom: { secretKeyRef: { name: litellm-secrets, key: master-key } }
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: script
              configMap:
                name: cluster-dashboard-litellm-key-script
