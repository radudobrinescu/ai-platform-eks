apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The cluster-dashboard app bundles TWO things that share the ai-platform namespace:
#   1. The dashboard itself (manifests.yaml: Deployment/Service/Ingress/RBAC +
#      the cluster-topology.html and backend.py ConfigMaps).
#   2. The Platform Health Agent (pha-*.yaml): event-watcher Deployment, RBAC,
#      config, and the scripts ConfigMap. The agent is always synced but idles
#      gracefully unless a Kiro API key Secret (platform-health-agent-secrets,
#      created manually with kubectl — see PLATFORM-HEALTH-AGENT.md) is
#      present — see pha-event-watcher.yaml + scripts/event_watcher.py.
resources:
  - manifests.yaml
  - oauth2-proxy.yaml
  - pha-rbac.yaml
  - pha-config.yaml
  - pha-event-watcher.yaml

# The HTML doesn't change often → no hash suffix → updated in place.
# The backend.py changes more often (especially during platform-health-agent
# integration) → hash suffix → automatic pod restart on change.
configMapGenerator:
  - name: cluster-dashboard-html
    namespace: ai-platform
    options:
      disableNameSuffixHash: true
    files:
      - cluster-topology.html
  - name: cluster-dashboard-backend
    namespace: ai-platform
    # Hash suffix ENABLED (kustomize default): backend.py is loaded once at
    # process start, so a content change must produce a new ConfigMap name →
    # new Deployment template → automatic pod restart. Without this the pod
    # keeps running stale code (e.g. a route the freshly-served HTML calls 404s).
    files:
      - scripts/backend.py
      # Package `dashboard`, flat keys <package>__<file> (see the pha note below).
      - dashboard____init__.py=scripts/dashboard/__init__.py
      - dashboard__api.py=scripts/dashboard/api.py
      - dashboard__app.py=scripts/dashboard/app.py
      - dashboard__approvals.py=scripts/dashboard/approvals.py
      - dashboard__auth.py=scripts/dashboard/auth.py
      - dashboard__config.py=scripts/dashboard/config.py
      - dashboard__cost.py=scripts/dashboard/cost.py
      - dashboard__dcgm.py=scripts/dashboard/dcgm.py
      - dashboard__deps.py=scripts/dashboard/deps.py
      - dashboard__derive.py=scripts/dashboard/derive.py
      - dashboard__k8s.py=scripts/dashboard/k8s.py
      - dashboard__litellm.py=scripts/dashboard/litellm.py
      - dashboard__models.py=scripts/dashboard/models.py
      - dashboard__pricing.py=scripts/dashboard/pricing.py
      - dashboard__prom.py=scripts/dashboard/prom.py
      - dashboard__snapshot.py=scripts/dashboard/snapshot.py
      - dashboard__sources.py=scripts/dashboard/sources.py
  # UI fonts (SIL Open Font License, see fonts/README.md), served by the
  # backend at /fonts/ so the page makes no request outside the dashboard.
  # Binary files land in binaryData.
  - name: cluster-dashboard-fonts
    namespace: ai-platform
    files:
      - fonts/manrope-latin.woff2
      - fonts/jetbrains-mono-latin.woff2
      - fonts/OFL-Manrope.txt
      - fonts/OFL-JetBrainsMono.txt
  # Script of the viewer-key CronJob (manifests.yaml). Hash suffix on, so a
  # script change gives the CronJob a new ConfigMap name.
  - name: cluster-dashboard-litellm-key-script
    namespace: ai-platform
    files:
      - scripts/litellm_viewer_key.py
  # Platform Health Agent scripts. Mounted by the event-watcher AND by every
  # Investigator/Remediator Job (the Job specs in event_watcher.py / backend.py
  # reference this ConfigMap by HARDCODED name) → keep the name stable, no hash.
  # Trade-off: the watcher doesn't auto-restart on script changes — use
  # `kubectl rollout restart deployment event-watcher -n ai-platform`.
  - name: platform-health-agent-scripts
    namespace: ai-platform
    options:
      disableNameSuffixHash: true
    files:
      - scripts/event_watcher.py
      - scripts/investigate.sh
      - scripts/remediate.sh
      - scripts/persist_findings.py
      - scripts/fix_command_policy.py
      - scripts/db_init.sh
      - scripts/ddl.sql
      # Shared Python package `pha`: ConfigMap keys cannot contain "/", so each
      # file is stored as <package>__<file> and the volumes that import it
      # project the keys back to pha/<file> (see `pha-lib` volumes). Add new
      # pha modules here AND to those volumes; tests/test_dash_packaging.py
      # fails if one is missed.
      - pha____init__.py=scripts/pha/__init__.py
      - pha__db.py=scripts/pha/db.py
      - pha__jobs.py=scripts/pha/jobs.py
      - pha__log.py=scripts/pha/log.py
      - pha__triggers.py=scripts/pha/triggers.py
