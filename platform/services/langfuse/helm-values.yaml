# Langfuse Helm Values — LLM Observability & Tracing
# Chart: langfuse/langfuse 2.x (Langfuse 4), pinned in argocd/bootstrap/templates/platform.yaml
# Repository: https://langfuse.github.io/langfuse-k8s
#
# Stores:
#   - PostgreSQL: the shared platform-db (platform/services/litellm/), database `langfuse`.
#   - ClickHouse: our own single-node StatefulSet, platform/services/langfuse-clickhouse/
#     (official image). The chart's bundled ClickHouse needs the alpha ClickHouse
#     operator plus cert-manager; we run it ourselves instead (decision 2026-11-16).
#   - Valkey (cache and queues) and SeaweedFS (S3 blob storage): the chart's sub-charts.
# Every credential is created by Terraform (langfuse-secrets, langfuse-valkey-auth,
# langfuse-s3-auth, platform-db-credentials in terraform/30.eks/30.cluster/capabilities.tf)
# and referenced here. Argo CD renders the chart with `helm template`, where the chart's
# own lookup-or-generate secrets would get a new random password on every sync.

langfuse:
  # --- Tracing on first boot (turnkey) ---
  # The langfuse-init Secret (Terraform-generated, ai-platform ns) carries the
  # headless-initialization env vars (LANGFUSE_INIT_ORG/PROJECT/USER + project
  # keys) plus NEXTAUTH_URL. On first boot Langfuse creates the org, project,
  # API keys, and admin user — and LiteLLM is handed the SAME keys
  # (langfuse-litellm-keys), so the very first model call is traced with no UI
  # clicks. See terraform/30.eks/30.cluster/langfuse-init.tf.
  #
  # The LANGFUSE_INIT_* keys drive headless initialization (org/project/API
  # keys/admin user on first boot). Each key is pulled individually from the
  # langfuse-init Secret via secretKeyRef. We deliberately
  # do NOT include NEXTAUTH_URL here: the chart already emits it from
  # `nextauth.url` (below), and a second entry would make ServerSideApply reject
  # the sync ("duplicate entries for key NEXTAUTH_URL"). `nextauth.url` is the
  # single source of truth for the browser-facing URL.
  additionalEnv:
    - name: LANGFUSE_INIT_ORG_ID
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_ORG_ID } }
    - name: LANGFUSE_INIT_ORG_NAME
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_ORG_NAME } }
    - name: LANGFUSE_INIT_PROJECT_ID
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_PROJECT_ID } }
    - name: LANGFUSE_INIT_PROJECT_NAME
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_PROJECT_NAME } }
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY } }
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_PROJECT_SECRET_KEY } }
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_USER_EMAIL } }
    - name: LANGFUSE_INIT_USER_NAME
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_USER_NAME } }
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_USER_PASSWORD } }
    # --- SSO (Cognito OIDC) ---
    # Optional refs: until Terraform (enable_sso) creates `sso-secrets`, the
    # custom provider stays disabled and the email/password (break-glass) admin
    # login still works. ALLOW_ACCOUNT_LINKING merges the SSO identity into the
    # existing seed admin when the email matches.
    - name: AUTH_CUSTOM_NAME
      value: "SSO"
    - name: AUTH_CUSTOM_SCOPE
      value: "openid email profile"
    - name: AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING
      value: "true"
    - name: AUTH_CUSTOM_CLIENT_ID
      valueFrom: { secretKeyRef: { name: sso-secrets, key: langfuse-client-id, optional: true } }
    - name: AUTH_CUSTOM_CLIENT_SECRET
      valueFrom: { secretKeyRef: { name: sso-secrets, key: langfuse-client-secret, optional: true } }
    - name: AUTH_CUSTOM_ISSUER
      valueFrom: { secretKeyRef: { name: sso-secrets, key: issuer, optional: true } }
    # Auto-provision SSO users into the platform org with a baseline role.
    # OSS Langfuse supports only ONE default role (no per-group mapping — that
    # needs Enterprise/SCIM); the break-glass init admin remains OWNER.
    - name: LANGFUSE_DEFAULT_ORG_ID
      valueFrom: { secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_ORG_ID } }
    - name: LANGFUSE_DEFAULT_ORG_ROLE
      value: "MEMBER"
    # LiteLLM sends traces over OpenTelemetry. Its v1.83 exporter does not send
    # `x-langfuse-ingestion-version: 4`, and without it Langfuse 4 shows the data
    # up to 15 minutes late. `direct` makes every OTLP ingestion real time.
    - name: LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR
      value: "direct"

  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: salt

  nextauth:
    # Browser-facing URL — NextAuth validates the sign-in Host header against it,
    # so it must match what users type. This `url` is only the INITIAL value the
    # chart renders into langfuse-web; the live value is reconciled at runtime:
    #
    #   - Default (ALB, turnkey): the langfuse-nextauth-url CronJob
    #     (platform/config/langfuse-nextauth-url.yaml) reads the ALB hostname off
    #     the ingress and sets NEXTAUTH_URL=http://<alb-host>:3000 on the
    #     Deployment, so UI sign-in works behind the load balancer with zero
    #     manual steps. ArgoCD selfHeal is told to ignore that env value
    #     (ignoreDifferences in argocd/bootstrap/templates/platform.yaml) so it sticks.
    #
    #   - Custom domain (production): pin a real URL here, e.g.
    #     https://langfuse.example.com (behind Route53 + ACM). The reconciler
    #     detects the non-placeholder value and leaves it alone.
    #
    #   - SSM tunnel fallback: the localhost default below still works via
    #     ./platformctl tunnel on a cluster with no ALB ingress.
    url: "http://localhost:3000"
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: nextauth-secret

  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: encryption-key

  web:
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    # The container migrates Postgres and ClickHouse before it serves its health
    # endpoint, and the chart has no startup probe. With the chart's default (first
    # check after 20 s) the kubelet kills a container that is still migrating about
    # 50 s after it started. A migration cut off half way stays marked as failed,
    # and every later start exits on it: a crash loop that only a manual database
    # repair ends. On a fresh install the migrations take longest, so liveness
    # waits 5 minutes. Readiness keeps the chart's default and holds traffic back.
    livenessProbe:
      initialDelaySeconds: 300

  ingress:
    enabled: false

# External PostgreSQL: the shared platform-db (managed in platform/services/litellm/).
postgresql:
  deploy: false
  host: platform-db.ai-platform.svc.cluster.local
  port: 5432
  auth:
    username: platform
    database: langfuse
    existingSecret: platform-db-credentials
    secretKeys:
      userPasswordKey: password

# ClickHouse: our own StatefulSet (platform/services/langfuse-clickhouse/), single
# node, no Keeper. The built-in `default` user's password is langfuse-secrets
# clickhouse-password on both sides.
clickhouse:
  deploy: false
  host: langfuse-clickhouse.ai-platform.svc.cluster.local
  httpPort: 8123
  nativePort: 9000
  database: default
  auth:
    username: default
    existingSecret: langfuse-secrets
    existingSecretKey: clickhouse-password
  migration:
    url: "clickhouse://langfuse-clickhouse.ai-platform.svc.cluster.local:9000"
    ssl: false
    autoMigrate: true
  cluster:
    enabled: false

# Valkey for caching and queues. The chart's ACL user `default` takes its
# password from langfuse-valkey-auth (key `default`).
redis:
  deploy: true
  auth:
    username: default
    existingSecret: langfuse-valkey-auth
    existingSecretPasswordKey: default
    usersExistingSecret: langfuse-valkey-auth
  # The sub-chart's default is the floating tag "8.0". Pinned by digest, so a
  # rebuild of the same tag with OS security fixes is a visible version change.
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: "8.1.12-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc"
  # Binds the cluster default StorageClass: `gp3` on classic/self-managed
  # clusters, `auto-ebs-sc` on EKS Auto Mode (terraform/30.eks/30.cluster/main.tf).
  # Do not pin a class here: `gp3` does not exist in Auto Mode.
  dataStorage:
    enabled: true
    requestedSize: 8Gi

# SeaweedFS (S3-compatible blob storage for events and media), all-in-one pod.
# langfuse-s3-auth (Terraform) holds the access key, the secret key and the
# SeaweedFS IAM config built from them.
s3:
  deploy: true
  bucket: langfuse
  # The sub-chart's tag (its appVersion), pinned by digest like Valkey.
  image:
    repository: chrislusf/seaweedfs
    tag: "4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9"
  auth:
    rootUser: langfuse
    existingSecret: langfuse-s3-auth
    rootUserSecretKey: accessKey
    rootPasswordSecretKey: secretKey
  # The sub-chart always renders an SFTP password Secret (a PreSync hook with
  # random passwords, new on every sync). SFTP stays off, so nothing uses it.
  allInOne:
    s3:
      existingConfigSecret: langfuse-s3-auth
    data:
      size: 50Gi

# Upgrades from chart 1.x: Argo CD prunes the old Bitnami StatefulSets
# (ClickHouse, ZooKeeper, Valkey) but not the volumes their volumeClaimTemplates
# created, which would keep ~82 GiB of EBS (and its cost) forever. After each
# sync, this Job deletes those exact PVCs once their StatefulSet is gone. Langfuse
# 1.x trace data is intentionally not carried over (decision 2026-11-16). On a
# cluster that never ran chart 1.x it finds nothing and exits.
extraManifests:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: langfuse-v1-volume-cleanup
      namespace: ai-platform
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: langfuse-v1-volume-cleanup
      namespace: ai-platform
    rules:
      - apiGroups: [""]
        resources: ["persistentvolumeclaims"]
        resourceNames:
          - data-langfuse-clickhouse-shard0-0
          - data-langfuse-zookeeper-0
          - data-langfuse-zookeeper-1
          - data-langfuse-zookeeper-2
          - valkey-data-langfuse-redis-primary-0
        verbs: ["get", "delete"]
      - apiGroups: ["apps"]
        resources: ["statefulsets"]
        verbs: ["get"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: langfuse-v1-volume-cleanup
      namespace: ai-platform
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: langfuse-v1-volume-cleanup
    subjects:
      - kind: ServiceAccount
        name: langfuse-v1-volume-cleanup
        namespace: ai-platform
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: langfuse-v1-volume-cleanup
      namespace: ai-platform
      annotations:
        argocd.argoproj.io/hook: PostSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: langfuse-v1-volume-cleanup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: alpine/k8s:1.37.2
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: /tmp
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  NS=ai-platform
                  for pair in \
                    langfuse-clickhouse-shard0:data-langfuse-clickhouse-shard0-0 \
                    langfuse-zookeeper:data-langfuse-zookeeper-0 \
                    langfuse-zookeeper:data-langfuse-zookeeper-1 \
                    langfuse-zookeeper:data-langfuse-zookeeper-2 \
                    langfuse-redis-primary:valkey-data-langfuse-redis-primary-0; do
                    sts="${pair%%:*}"; pvc="${pair#*:}"
                    kubectl get pvc "$pvc" -n "$NS" >/dev/null 2>&1 || continue
                    # Wait (up to 10 min) for Argo CD to prune the old StatefulSet.
                    n=0
                    while kubectl get statefulset "$sts" -n "$NS" >/dev/null 2>&1; do
                      n=$((n + 1))
                      if [ "$n" -gt 60 ]; then echo "kept $pvc: StatefulSet $sts still exists"; continue 2; fi
                      sleep 10
                    done
                    kubectl delete pvc "$pvc" -n "$NS" --wait=false && echo "deleted $pvc (Langfuse 1.x volume)"
                  done
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
