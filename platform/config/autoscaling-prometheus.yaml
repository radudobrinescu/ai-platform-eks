# Autoscaling Prometheus — a small, always-on Prometheus dedicated to KEDA
# replica autoscaling of the llm-d serving tier. Deliberately NOT the optional
# 40.observability stack: the default serving tier's elasticity must not depend
# on observability being enabled.
#
# Scope: scrapes only the `inference` namespace: llm-d model-server pods (by the
# `llm-d.ai/pool` label, `modelserver` port 8000; vLLM metrics) and llm-d router
# (EPP) pods (by the `llm-d-router-gateway: <pool>-epp` label, `metrics` port
# 9090; requests in flight and held, which drive KEDA), plus every LiteLLM pod
# (namespace `ai-platform`, found through a headless Service). Ephemeral
# storage, 2h retention (KEDA only needs recent values). KEDA's built-in
# Prometheus scaler queries the Service below.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoscaling-prometheus
  namespace: inference
  labels: { app.kubernetes.io/part-of: ai-platform, ai-platform/component: autoscaling }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autoscaling-prometheus
  namespace: inference
  labels: { app.kubernetes.io/part-of: ai-platform, ai-platform/component: autoscaling }
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autoscaling-prometheus
  namespace: inference
  labels: { app.kubernetes.io/part-of: ai-platform, ai-platform/component: autoscaling }
subjects:
  - kind: ServiceAccount
    name: autoscaling-prometheus
    namespace: inference
roleRef:
  kind: Role
  name: autoscaling-prometheus
  apiGroup: rbac.authorization.k8s.io
---
# The router (EPP) keeps its /metrics authenticated (--metrics-endpoint-auth,
# on by default): it checks the caller's token with a TokenReview and asks
# whether that identity may `get` the /metrics URL. This grants exactly that to
# this Prometheus's service account, as llm-d documents (docs/metrics.md in
# llm-d-router). A non-resource URL grant is cluster-wide by nature: it also
# lets this account read other components' /metrics (for example the API
# server's), and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autoscaling-prometheus-metrics-reader
  labels: { app.kubernetes.io/part-of: ai-platform, ai-platform/component: autoscaling }
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autoscaling-prometheus-metrics-reader
  labels: { app.kubernetes.io/part-of: ai-platform, ai-platform/component: autoscaling }
subjects:
  - kind: ServiceAccount
    name: autoscaling-prometheus
    namespace: inference
roleRef:
  kind: ClusterRole
  name: autoscaling-prometheus-metrics-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoscaling-prometheus-config
  namespace: inference
  labels: { app.kubernetes.io/part-of: ai-platform, ai-platform/component: autoscaling }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # llm-d model-server (vLLM) pods — saturation signals for KEDA.
      - job_name: llmd-vllm
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [inference]
        relabel_configs:
          # keep only pods that belong to an llm-d InferencePool
          - source_labels: [__meta_kubernetes_pod_label_llm_d_ai_pool]
            action: keep
            regex: .+
          # scrape only the model-server port (8000), not every declared port
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: modelserver
          # only Running pods
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          # expose the pool + role + pod as query labels (KEDA filters by pool,
          # and by role for the disaggregated prefill/decode pools)
          - source_labels: [__meta_kubernetes_pod_label_llm_d_ai_pool]
            target_label: pool
          - source_labels: [__meta_kubernetes_pod_label_llm_d_ai_role]
            target_label: role
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # llm-d router (EPP) pods — requests in flight (llm_d_epp_request_running)
      # and requests held while no replica runs (llm_d_epp_flow_control_queue_size).
      # KEDA sizes each pool on these and wakes a pool at zero. The EPP's
      # /metrics needs a bearer token: this Prometheus sends its own service
      # account token (granted `get /metrics` above). Plain HTTP inside the
      # cluster, as for vLLM: the EPP serves metrics without TLS by default.
      - job_name: llmd-epp
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [inference]
        relabel_configs:
          # keep only llm-d router pods (the chart labels them <release>-epp,
          # and the release is the pool's name)
          - source_labels: [__meta_kubernetes_pod_label_llm_d_router_gateway]
            action: keep
            regex: .+-epp
          # the EPP container's metrics port (the Envoy sidecar's is metrics-19001)
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          # pool = the release name, so KEDA filters the same way as for vLLM
          - source_labels: [__meta_kubernetes_pod_label_llm_d_router_gateway]
            regex: (.+)-epp
            target_label: pool
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # LiteLLM (the always-on gateway) — per-model request counters. This is
      # the second wake signal for a pool at zero (the first is the request the
      # router holds, above): LiteLLM counts a request for a model before it
      # reaches the router, so the counter moves even if the router could not
      # hold the request.
      # Every LiteLLM pod is its own target. A counter lives in one process, so
      # through the ClusterIP Service one series took its samples from whichever
      # replica answered: rate() read each drop as a counter reset and reported
      # requests that never came (an idle pool stayed awake), and missed real
      # ones. The headless Service litellm-metrics
      # (platform/services/litellm/litellm.yaml) answers one A record per ready
      # pod, so this needs no pod discovery / RBAC in another namespace. Sum
      # over the targets in queries (the KEDA trigger does).
      # LiteLLM serves /metrics without a key (require_auth_for_metrics_endpoint:
      # false in litellm-config). The load balancer does not forward that path,
      # but any workload in the cluster can read it (see the note in
      # litellm-config).
      - job_name: litellm
        metrics_path: /metrics
        dns_sd_configs:
          - names: ["litellm-metrics.ai-platform.svc.cluster.local"]
            type: A
            port: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaling-prometheus
  namespace: inference
  labels: { app.kubernetes.io/name: autoscaling-prometheus, app.kubernetes.io/part-of: ai-platform, ai-platform/component: autoscaling }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: autoscaling-prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: autoscaling-prometheus, ai-platform/component: autoscaling }
      annotations:
        # Prometheus reads prometheus.yml at start only and nothing reloads it.
        # These are plain manifests, so nothing restarts the pod when the
        # ConfigMap above changes: raise this number in the same commit as any
        # change to the scrape config (tests/test_llmd_scale_to_zero.py records
        # the config each revision stands for and fails otherwise).
        ai-platform/config-revision: "2"
    spec:
      serviceAccountName: autoscaling-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
          ports:
            - { name: web, containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap: { name: autoscaling-prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: autoscaling-prometheus
  namespace: inference
  labels: { app.kubernetes.io/name: autoscaling-prometheus, app.kubernetes.io/part-of: ai-platform, ai-platform/component: autoscaling }
spec:
  selector: { app.kubernetes.io/name: autoscaling-prometheus }
  ports:
    - { name: web, port: 9090, targetPort: web }
