# AITeam 'search' — generated by 'platformctl onboard-team'.
# Onboards the team: team-search namespace, GPU quota, RBAC, namespace
# isolation, and a scoped LiteLLM key (budget + rpm/tpm). Models this team
# deploys go under workloads/models/team-search/. Removal is 'git rm' this file.
apiVersion: kro.run/v1alpha1
kind: AITeam
metadata:
  name: search
  namespace: ai-platform
spec:
  teamName: search
  models: ["qwen2-5-3b-instruct","nova-lite"]
  maxBudget: "50"
  budgetDuration: "30d"
  rpmLimit: 100
  tpmLimit: 100000
  cpuQuota: "4"
  memoryQuota: "8Gi"
  gpuQuota: 2
