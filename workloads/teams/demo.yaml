# AITeam 'demo' — generated by 'platformctl onboard-team'.
# Onboards the team: team-demo namespace, GPU quota, RBAC, namespace
# isolation, and a scoped LiteLLM key (budget + rpm/tpm). Models this team
# deploys go under workloads/models/team-demo/. Removal is 'git rm' this file.
apiVersion: kro.run/v1alpha1
kind: AITeam
metadata:
  name: demo
  namespace: ai-platform
spec:
  teamName: demo
  models: ["*"]
  maxBudget: "50"
  budgetDuration: "30d"
  rpmLimit: 100
  tpmLimit: 100000
  cpuQuota: "4"
  memoryQuota: "8Gi"
  gpuQuota: 0
