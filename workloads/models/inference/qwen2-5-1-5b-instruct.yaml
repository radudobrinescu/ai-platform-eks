apiVersion: kro.run/v1alpha1
kind: VLLMEndpoint
metadata:
  name: qwen2-5-1-5b-instruct
  namespace: inference
spec:
  model: "Qwen/Qwen2.5-1.5B-Instruct"
  gpuCount: 1
  shared: true          # fits with headroom — up to 4 models share the GPU
  maxModelLen: 8192
  minVramPerGpuGiB: 17
  workerMemory: "8Gi"
  # maxNumSeqs: 64
  replicas: 1
  toolCallParser: hermes   # auto-detected from Qwen2ForCausalLM — enables tool calling; remove for chat-only
