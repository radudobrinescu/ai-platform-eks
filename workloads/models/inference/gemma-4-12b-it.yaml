apiVersion: kro.run/v1alpha1
kind: VLLMEndpoint
metadata:
  name: gemma-4-12b-it
  namespace: inference
spec:
  model: "google/gemma-4-12B-it"
  gpuCount: 1
  maxModelLen: 8192
  minVramPerGpuGiB: 34
  workerMemory: "27Gi"
  # maxNumSeqs: 64
  replicas: 1
  toolCallParser: gemma4   # auto-detected from Gemma4UnifiedForConditionalGeneration — enables tool calling; remove for chat-only
