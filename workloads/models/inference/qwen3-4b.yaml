apiVersion: kro.run/v1alpha1
kind: VLLMEndpoint
metadata:
  name: qwen3-4b
  namespace: inference
spec:
  model: "Qwen/Qwen3-4B"
  gpuCount: 1
  maxModelLen: 8192
  minVramPerGpuGiB: 12
  workerMemory: "12Gi"
  # maxNumSeqs: 64
  replicas: 1
  toolCallParser: hermes   # auto-detected from Qwen3ForCausalLM — enables tool calling; remove for chat-only
