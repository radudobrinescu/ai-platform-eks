# E2E: provision a product ref on a real cluster, prove it works, tear it down.
#
# Dispatch only (Actions -> e2e -> Run workflow). modes fresh,upgrade runs every
# (mode, profile) job in one run, so one approval covers a whole release. Two checkouts: this branch at
# the workspace root (the harness) and the product ref under test in subject/.
# The harness drives the subject only through its own ./platformctl, on a
# throwaway GitOps branch e2e/<env> that Argo CD tracks and that is deleted at
# teardown (harness/e2e.py).
#
#   mode fresh     subject = the ref under test
#   mode upgrade   base = what is provisioned first (previous release or main),
#                  subject = the candidate merged into it, upgraded with the
#                  candidate's `./platformctl upgrade`
#
# Results: commit status `e2e/<mode>-<profile>` (pending -> success | failure)
# on the subject SHA (upgrade mode: the candidate SHA), linking to this run;
# a redacted report as the job summary and an artifact.
#
# COST + SAFETY. Every run creates billable infrastructure with a provisioning
# role. Therefore: the job runs in the GitHub Environment `e2e`, which has a
# required reviewer (nothing touches AWS before a human approves); the role's
# trust is pinned to this repo and that environment (terraform/github-oidc);
# teardown always runs unless `keep`, with a safety net if the harness is
# killed. No pull_request trigger of any kind.
#
# CONFIGURATION (repository settings; the job skips green until the first two exist):
#   variable E2E_ROLE_ARN         role_arn output of terraform/github-oidc
#   secret   E2E_PUSH_TOKEN       fine-grained PAT on this repo: Contents + Workflows
#                                 write (pushes e2e/* branches that may change workflows)
#   variable E2E_REGION           optional, default eu-central-1
#   variables E2E_IDC_INSTANCE_ARN, E2E_IDC_REGION, E2E_IDC_GROUP_ID
#                                 Identity Center for profile `managed`
#   environment e2e               with a required reviewer
name: e2e
# Shown in the run list, in the approval request and on the approval screen, so
# each pending run says what it tests. The factory adds what the candidate
# changes (input `note`), e.g.
# "cycle v2026.11.8: 2 updates: vllm v0.34.1, open-webui v0.13.5 · e2e fresh,upgrade · release/v2026.11.8 (from v2026.11.7) · default,managed".
# The job "what this run tests" writes the details to the run's summary page,
# next to the approval button: the candidate's pull request with the table of
# changed components, and what happens if the run is not approved.
run-name: >-
  ${{ inputs.note && format('{0} · ', inputs.note) || '' }}e2e ${{ inputs.modes }} · ${{ inputs.subject }}${{ contains(inputs.modes, 'upgrade') && format(' (from {0})', inputs.base) || '' }}
  · ${{ inputs.profiles }}${{ inputs.keep && ' · keep' || '' }}

on:
  workflow_dispatch:
    inputs:
      modes:
        description: "fresh: provision subject. upgrade: provision base, upgrade to subject. A release needs fresh,upgrade (one approval for all jobs)."
        type: choice
        options: ["fresh", "upgrade", "fresh,upgrade"]
        default: fresh
      subject:
        description: "Ref under test: branch, tag or SHA (upgrade mode: the candidate)"
        type: string
        required: true
        default: main
      base:
        description: "Upgrade mode only: ref provisioned first (previous release tag or main)"
        type: string
        default: main
      profiles:
        description: "Comma-separated profiles: default (self-managed Argo CD + kro), managed (EKS Managed Capabilities)"
        type: string
        default: "default,managed"
      keep:
        description: "Keep the cluster and the e2e branch after the run (billing continues)"
        type: boolean
        default: false
      with_llmd:
        description: "Exercise the llm-d tier and KEDA autoscaling (adds GPU nodes, ~20 min per job)"
        type: boolean
        default: true
      gpu_instance_type:
        description: "Pin the vLLM GPU smoke model to this EC2 instance type, e.g. g7.2xlarge (empty: Karpenter picks)"
        type: string
        default: ""
      note:
        description: "Shown first in the run's name: what is being tested, in a few words (the factory fills it in)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.modes }}-${{ inputs.subject }}-${{ inputs.base }}
  cancel-in-progress: false

jobs:
  # Runs before anything waits for approval and needs no environment: it only
  # reads the candidate's pull request and writes it to the run's summary.
  about:
    name: what this run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SUBJECT_REF: ${{ inputs.subject }}
      BASE_REF: ${{ inputs.base }}
      MODES: ${{ inputs.modes }}
      PROFILES: ${{ inputs.profiles }}
      WAIT_DAYS: ${{ vars.WAIT_DAYS || '5' }}
    steps:
      - name: Write what is waiting for approval to the run summary
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --head "$SUBJECT_REF" --state open --limit 1 \
            --json number,title,url,body > pr.json || echo '[]' > pr.json
          {
            echo "## What this run tests"
            echo
            if [ "$(jq length pr.json)" = 1 ]; then
              jq -r '.[0] | "Candidate: [#\(.number) \(.title)](\(.url))\n\n\(.body)"' pr.json
            else
              printf 'Ref `%s`' "$SUBJECT_REF"
              case "$MODES" in *upgrade*) printf ', upgraded from `%s`' "$BASE_REF" ;; esac
              printf ' (modes %s; profiles %s). There is no open pull request from this ref: the run was started by hand, not by the factory.\n' "$MODES" "$PROFILES"
            fi
            echo
            echo "---"
            echo
            echo "**Approving** starts one cluster per job (mode x profile): about 95 minutes and \$5-10 for all four."
            echo "**Not approving** changes nothing. A candidate of the factory is replaced by a fresh one after ${WAIT_DAYS} days; rejecting the run has the same effect."
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: check configuration and inputs
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.cfg.outputs.configured }}
      matrix: ${{ steps.cfg.outputs.matrix }}
    steps:
      - name: Check configuration (skip cleanly if unset) and validate inputs
        id: cfg
        env:
          ROLE: ${{ vars.E2E_ROLE_ARN }}
          HAS_PUSH_TOKEN: ${{ secrets.E2E_PUSH_TOKEN != '' }}
          PROFILES: ${{ inputs.profiles }}
          MODES: ${{ inputs.modes }}
          SUBJECT_REF: ${{ inputs.subject }}
          BASE_REF: ${{ inputs.base }}
        run: |
          set -euo pipefail
          ref_rx='^[A-Za-z0-9._/-]+$'
          [[ "$SUBJECT_REF" =~ $ref_rx ]] || { echo "::error::invalid subject ref"; exit 1; }
          [[ "$BASE_REF" =~ $ref_rx ]] || { echo "::error::invalid base ref"; exit 1; }
          profiles=()
          IFS=',' read -ra items <<< "$PROFILES"
          for p in "${items[@]}"; do
            p="${p//[[:space:]]/}"
            case "$p" in default|managed) profiles+=("$p") ;; "") ;; *) echo "::error::unknown profile '$p'"; exit 1 ;; esac
          done
          [ "${#profiles[@]}" -gt 0 ] || { echo "::error::no profile selected"; exit 1; }
          modes=()
          IFS=',' read -ra items <<< "$MODES"
          for m in "${items[@]}"; do
            case "$m" in fresh|upgrade) modes+=("$m") ;; *) echo "::error::unknown mode '$m'"; exit 1 ;; esac
          done
          # One job per (mode, profile); all share this run, so one approval covers them.
          json='{"include":['
          for m in "${modes[@]}"; do for p in "${profiles[@]}"; do json+="{\"mode\":\"$m\",\"profile\":\"$p\"},"; done; done
          json="${json%,}]}"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          if [ -z "$ROLE" ] || [ "$HAS_PUSH_TOKEN" != "true" ]; then
            echo "::notice::e2e not configured: set variable E2E_ROLE_ARN and secret E2E_PUSH_TOKEN to enable. Skipping (no AWS call)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: ${{ matrix.mode }} / ${{ matrix.profile }}
    needs: plan
    if: needs.plan.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    environment: e2e
    permissions:
      contents: read
      id-token: write
      statuses: write
      issues: write        # only for "Report this job's environment if it is still there"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    outputs:
      # Every job of the run sees the same leftovers; any job's answer will do.
      leaked: ${{ steps.preflight.outputs.leaked }}
    env:
      MODE: ${{ matrix.mode }}
      PROFILE: ${{ matrix.profile }}
      SUBJECT_REF: ${{ inputs.subject }}
      BASE_REF: ${{ inputs.base }}
      KEEP: ${{ inputs.keep }}
      WITH_LLMD: ${{ inputs.with_llmd }}
      GPU_INSTANCE_TYPE: ${{ inputs.gpu_instance_type }}
      E2E_REGION: ${{ vars.E2E_REGION || 'eu-central-1' }}
      CONTEXT: e2e/${{ matrix.mode }}-${{ matrix.profile }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the harness (this branch)
        uses: actions/checkout@v7

      - name: Check out the product ref under test into subject/
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.mode == 'upgrade' && inputs.base || inputs.subject }}
          path: subject
          fetch-depth: 0
          # Pushes the throwaway e2e/* branch (and the commits ./platformctl makes on it).
          token: ${{ secrets.E2E_PUSH_TOKEN }}

      - name: Resolve SHAs and env name
        id: refs
        run: |
          set -euo pipefail
          base_sha="$(git -C subject rev-parse HEAD)"
          if [ "$MODE" = upgrade ]; then
            git -C subject fetch --quiet origin "$SUBJECT_REF"
            status_sha="$(git -C subject rev-parse FETCH_HEAD)"
          else
            status_sha="$base_sha"
          fi
          # Same format as harness/e2e.py env_name(); 4 digits keep EKS node group
          # name prefixes within 37 characters.
          env_name="e2e${MODE:0:1}${PROFILE:0:1}$((GITHUB_RUN_NUMBER % 10000))"
          {
            echo "BASE_SHA=$base_sha"
            echo "STATUS_SHA=$status_sha"
            echo "ENV_NAME=$env_name"
          } >> "$GITHUB_ENV"
          echo "Testing ${MODE} on ${status_sha} as ${env_name}"

      - name: Commit status pending
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state=pending -f context="$CONTEXT" -f target_url="$RUN_URL" \
            -f description="E2E ${MODE} (${PROFILE}) running" >/dev/null

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v5
      - uses: azure/setup-helm@v5
      - name: Install jq, make, session-manager-plugin, Python deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq make >/dev/null
          curl -fsSL -o /tmp/ssm.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/ssm.deb >/dev/null
          pip install --quiet boto3 pyyaml

      - name: Install Trivy (image scan of fresh environments)
        if: matrix.mode == 'fresh'
        # The scan is report-only: if the download fails, the report says the
        # scan did not run and the job goes on.
        continue-on-error: true
        env:
          # Pinned and checksummed; bump both together (Trivy releases on GitHub).
          TRIVY_VERSION: "0.76.2"
          TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
        run: |
          set -euo pipefail
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "/tmp/$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  /tmp/$f" | sha256sum -c -
          sudo tar -xzf "/tmp/$f" -C /usr/local/bin trivy
          trivy --version | head -1

      - name: Runner egress IP (EKS API allowlist)
        run: |
          set -euo pipefail
          ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::could not read the runner egress IP"; exit 1; }
          echo "::add-mask::$ip"
          echo "OPERATOR_CIDR=${ip}/32" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC -> E2E provisioning role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.E2E_ROLE_ARN }}
          aws-region: ${{ env.E2E_REGION }}
          role-duration-seconds: 21600
          mask-aws-account-id: true

      - name: Log in to ECR Public (anonymous pulls from runner IPs hit 429 data limits)
        run: |
          set -euo pipefail
          # The Karpenter chart is oci://public.ecr.aws; Terraform's Helm provider
          # resolves it on apply AND on the refresh before destroy, so an
          # anonymous 429 breaks both. ECR Public tokens come from us-east-1 only
          # and last 12 h (the job's limit is 6 h).
          aws ecr-public get-login-password --region us-east-1 \
            | helm registry login --username AWS --password-stdin public.ecr.aws

      # Before anything is provisioned: environments an earlier run left behind
      # (they bill, and hold Elastic IPs), and whether this job still has the
      # addresses it needs. Without them the job is marked "not run", not
      # "failed": a full account is not the candidate's fault, and a failed E2E
      # makes the factory blame the updates in it.
      - name: Preflight (leftover environments, Elastic IP headroom)
        id: preflight
        run: |
          set -uo pipefail
          python3 harness/leftovers.py --env "$ENV_NAME" --region "$E2E_REGION"
          rc=$?
          if [ "$rc" = 3 ]; then
            echo "::error::not enough free Elastic IPs for ${ENV_NAME}; see the job summary for environments left behind"
            exit 1
          fi
          exit 0

      - name: Run the harness
        id: e2e
        # Leaves time for the safety net below if the harness hangs.
        timeout-minutes: 290
        env:
          E2E_IDC_INSTANCE_ARN: ${{ vars.E2E_IDC_INSTANCE_ARN }}
          E2E_IDC_REGION: ${{ vars.E2E_IDC_REGION }}
          E2E_IDC_GROUP_ID: ${{ vars.E2E_IDC_GROUP_ID }}
        run: |
          set -u
          args=()
          if [ "$KEEP" = true ]; then args+=(--keep); fi
          if [ "$WITH_LLMD" = true ]; then args+=(--with-llmd); fi
          if [ -n "${GPU_INSTANCE_TYPE:-}" ]; then
            if ! [[ "$GPU_INSTANCE_TYPE" =~ ^[a-z][a-z0-9-]*\.[a-z0-9]+$ ]]; then
              echo "::error::gpu_instance_type is not an EC2 instance type: $GPU_INSTANCE_TYPE"; exit 2
            fi
            args+=(--gpu-instance-type "$GPU_INSTANCE_TYPE")
          fi
          # Report-only: lists fixable HIGH/CRITICAL CVEs of every running image.
          if [ "$MODE" = fresh ]; then args+=(--image-scan); fi
          if [ "$MODE" = upgrade ]; then refs=("$BASE_SHA" "$STATUS_SHA"); else refs=("$STATUS_SHA"); fi
          set +e
          python3 harness/e2e.py "$MODE" "${refs[@]}" --profile "$PROFILE" \
            --run-number "$((GITHUB_RUN_NUMBER % 10000))" --region "$E2E_REGION" \
            --operator-cidr "$OPERATOR_CIDR" --subject-dir subject --report-dir reports "${args[@]}"
          rc=$?
          set -e
          # The step itself succeeds so the status, report and safety-net steps
          # see a clean outcome; the final Result step fails the job.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Safety net, tear down if the harness was killed before its own teardown
        if: always() && steps.e2e.outputs.rc == '' && inputs.keep != true
        working-directory: subject
        run: |
          # The harness tears down itself; this only runs if it never returned
          # (step timeout, cancel). `down` is idempotent.
          if [ -f "terraform/00.global/vars/${ENV_NAME}.tfvars" ]; then
            printf '%s\n' "$ENV_NAME" | ./platformctl down "$ENV_NAME" \
              || echo "::warning::teardown reported errors; check for orphans of ${ENV_NAME}"
          fi
          git push --quiet origin --delete "e2e/${ENV_NAME}" 2>/dev/null || true

      # A teardown can report success and leave the cluster running (2026-11-18:
      # an old base's `down`). It bills until a person removes it, and the
      # preflight of a later run reports it only once it is 8 hours old. So look
      # now, and say so in the issue the preflight uses. Never fails the job.
      - name: Report this job's environment if it is still there
        if: always() && inputs.keep != true
        continue-on-error: true
        run: |
          set -uo pipefail
          [ -n "${ENV_NAME:-}" ] || exit 0
          left="$(python3 harness/leftovers.py --env "$ENV_NAME" --region "$E2E_REGION" --own)" || exit 0
          [ -n "$left" ] || exit 0
          echo "::error::${ENV_NAME} was not torn down, still billing: ${left}"
          title="E2E environments left behind"
          {
            echo "The E2E job ${MODE} / ${PROFILE} did not tear down its own environment \`${ENV_NAME}\`. It keeps billing, and holds 3 of the account's Elastic IPs."
            echo
            echo "- ${left}"
            echo
            echo "How to remove it: the lifecycle README, \"An environment that was left behind\". Run: ${RUN_URL}"
          } > own.md
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file own.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file own.md; fi

      - name: Commit status result
        if: always()
        env:
          RC: ${{ steps.e2e.outputs.rc }}
          BLOCKED: ${{ steps.preflight.outputs.blocked }}
        run: |
          if [ "$RC" = "0" ]; then state=success; outcome=passed; else state=failure; outcome=failed; fi
          # Blocked by the preflight: nothing ran, so nothing failed. "pending"
          # keeps the factory from retrying or blaming; the candidate is cut
          # again after WAIT_DAYS, and the leftovers job has opened an issue.
          if [ "${BLOCKED:-}" = true ]; then state=pending; outcome="not run (no free Elastic IPs)"; fi
          # The text says what this run tested (upgrade: from which base; llm-d on
          # or off). `release.py finish` accepts only the release's own run: upgrade
          # from the previous release, llm-d on. Same format as status_description()
          # in tools/release.py (tests/test_workflows.py keeps the two in step).
          desc="E2E ${MODE} (${PROFILE}) ${outcome}"
          if [ "$MODE" = upgrade ]; then desc="${desc}; base=${BASE_REF}"; fi
          desc="${desc}; llmd=${WITH_LLMD}"
          desc="${desc:0:140}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -f state="$state" -f context="$CONTEXT" -f target_url="$RUN_URL" -f description="$desc" >/dev/null

      - name: Report to the job summary
        if: always()
        run: |
          shopt -s nullglob
          reports=(reports/*.md)
          if [ "${#reports[@]}" -gt 0 ]; then cat "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"
          else printf '## E2E %s / %s\n\nNo report produced (setup or runner failure). See the job log.\n' "$MODE" "$PROFILE" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ matrix.mode }}-${{ matrix.profile }}
          path: reports/
          if-no-files-found: ignore

      - name: Result
        env:
          RC: ${{ steps.e2e.outputs.rc }}
        run: |
          [ "$RC" = "0" ] || { echo "::error::E2E ${MODE} (${PROFILE}) failed (exit ${RC:-none}); see the report"; exit 1; }
          echo "E2E ${MODE} (${PROFILE}) passed"

  # Environments an earlier run left behind keep billing until a person tears
  # them down. The preflight of each job found them; say so where it is seen.
  leftovers:
    name: report environments left behind
    needs: e2e
    if: always() && needs.e2e.outputs.leaked != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          LEAKED: ${{ needs.e2e.outputs.leaked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="E2E environments left behind"
          {
            echo "An E2E run found environments that an earlier run did not tear down. They keep billing, and each holds 3 of the account's Elastic IPs, so later runs may not start."
            echo
            for c in $LEAKED; do echo "- \`${c}\`"; done
            echo
            echo "Tear each one down from a checkout of the ref it ran, with the E2E account's credentials: \`./platformctl down <env>\` (the env name is the last part of the cluster name). Found by: ${RUN_URL}"
          } > body.md
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md; fi

  # When every job of this run passed, start release-finish: it merges, tags and
  # publishes the release in flight if all four e2e/* statuses on its head are
  # green, and does nothing otherwise (so any green run may start it: a release
  # run, a rerun of the jobs that failed, or a run of something else).
  # Dispatched explicitly, not left to `on: workflow_run` in release-finish.yaml:
  # the scheduled release candidate starts this workflow with GITHUB_TOKEN, and
  # the completion of such a run did not start release-finish (v2026.11.7). A
  # workflow_dispatch made with GITHUB_TOKEN does start a run.
  finish:
    name: start release-finish
    needs: [plan, e2e]
    if: needs.plan.outputs.configured == 'true' && needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release-finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-finish.yaml --repo "$GITHUB_REPOSITORY" --ref lifecycle
          echo "release-finish dispatched; it finishes the release in flight if its four statuses are green." >> "$GITHUB_STEP_SUMMARY"
