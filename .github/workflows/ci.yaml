# CI — validates the repo before a merge to main auto-deploys via ArgoCD.
#
# ArgoCD watches `main` with automated sync + prune, so a bad manifest, a broken
# kustomize build, or a syntax error in the embedded controller Python reaches the
# cluster the moment it lands. This workflow is the gate CONTRIBUTING.md promises:
# it fails the PR before that happens. It runs no cloud credentials and touches no
# cluster — pure static validation.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "v1.16.6"
      - name: terraform fmt (check)
        run: terraform fmt -check -recursive terraform/
      - name: terraform validate (per module)
        run: |
          set -euo pipefail
          # Validate each module in isolation. `-backend=false` skips remote state
          # so no AWS creds are needed; this catches HCL + provider-schema errors.
          find terraform -name backend.tf -not -path '*/.terraform/*' -print0 \
            | while IFS= read -r -d '' bt; do
                dir="$(dirname "$bt")"
                echo "::group::validate $dir"
                terraform -chdir="$dir" init -backend=false -input=false >/dev/null
                terraform -chdir="$dir" validate
                echo "::endgroup::"
              done
          # Admin-applied modules without a backend.tf (deliberately outside
          # apply-all discovery) still get validated.
          for dir in terraform/ci/github-oidc; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  python:
    name: python compile + lint
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=pypi depName=ruff
      RUFF_VERSION: "0.17.1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: byte-compile every tracked module (catches syntax/indentation)
        run: |
          set -euo pipefail
          git ls-files '*.py' | grep -v '/.terraform/' | xargs -r python3 -m py_compile
      - name: ruff (non-blocking style report)
        run: |
          pip install "ruff==${RUFF_VERSION}"
          # Report only — style drift shouldn't block a platform PR, but surface it.
          ruff check --output-format=github ops/ platform/ || true

  tests:
    name: pytest (unit tests + guards)
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=pypi depName=pytest
      PYTEST_VERSION: "9.1.1"
      # renovate: datasource=pypi depName=pyyaml
      PYYAML_VERSION: "6.0.3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: install test deps
        # boto3: sweep_env and recommend_instance.cli import it at module load;
        # pyyaml: used by test_render. backend.py / addon_freshness.py guard or
        # lazy-load their heavy deps (psycopg, jwt, boto3), so the suite imports
        # cleanly with just these two. No cloud credentials — pure static tests.
        run: pip install --quiet "pytest==${PYTEST_VERSION}" "pyyaml==${PYYAML_VERSION}" boto3
      - name: pytest
        # Blocks merge on any failing unit test — including the EKS managed-addon
        # freshness guard (tests/test_addon_freshness.py), the Renovate coverage
        # guard (tests/test_renovate_coverage.py) and the CI gate guard
        # (tests/test_ci_gates.py).
        run: python3 -m pytest -q

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck all tracked shell scripts + platformctl
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # platformctl has no .sh extension; include it explicitly.
          mapfile -t files < <(git ls-files '*.sh'; echo platformctl)
          # -S warning: fail on warnings+errors, allow info/style noise.
          shellcheck -S warning "${files[@]}"

  manifests:
    name: helm template + kustomize build + yaml + kubeconform
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.*)$
      KUBECONFORM_VERSION: "0.8.0"
      # renovate: datasource=pypi depName=yamllint
      YAMLLINT_VERSION: "1.38.0"
      # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.*)$
      KUSTOMIZE_VERSION: "5.8.3"
      # Custom kinds kubeconform has no schema for: KRO RGDs + the kinds they define.
      KUBECONFORM_SKIP: "ResourceGraphDefinition,LLMDEndpoint,LLMDDisaggEndpoint,VLLMEndpoint,AITeam"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: azure/setup-helm@v5
      - name: install tools
        run: |
          set -euo pipefail
          # kustomize: pinned release tarball. The upstream install_kustomize.sh
          # calls the GitHub API unauthenticated and fails CI whenever the
          # runner's shared IP is rate-limited.
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar xz kustomize && sudo mv kustomize /usr/local/bin/
          # kubeconform (schema validation; skips CRD kinds it doesn't know)
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform && sudo mv kubeconform /usr/local/bin/
          pip install --quiet "yamllint==${YAMLLINT_VERSION}" pyyaml
      - name: yamllint (relaxed; blocks on syntax errors, prints style warnings)
        # argocd/bootstrap/templates/ is Helm-templated ({{- }} is not YAML) and is
        # validated by the `helm template argocd/bootstrap` step below instead.
        run: |
          yamllint -d "{extends: relaxed, ignore: [argocd/bootstrap/templates/], rules: {line-length: disable, comments: disable, document-start: disable, trailing-spaces: disable, empty-lines: disable}}" \
            argocd/ platform/ workloads/
      - name: helm template argocd/bootstrap (the app-of-apps chart Terraform renders)
        run: helm template bootstrap argocd/bootstrap > /dev/null
      - name: helm template platform charts (from the ApplicationSet) + kubeconform
        # Reads every `type: helm` element of the platform ApplicationSet — chart,
        # chartRepo, chartVersion, valuesPath — and renders it with the repo's values
        # file. A Renovate chartVersion bump is therefore rendered against OUR values
        # with no CI edit, which catches removed/renamed values and schema breaks
        # before ArgoCD meets them on the cluster.
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/charts.tsv
          import yaml
          doc = yaml.safe_load(open("argocd/bootstrap/templates/platform.yaml"))
          for el in doc["spec"]["generators"][0]["list"]["elements"]:
              if el.get("type") == "helm":
                  print("\t".join(str(el[k]) for k in ("name", "chart", "chartRepo", "chartVersion", "valuesPath", "namespace")))
          PY
          test -s /tmp/charts.tsv || { echo "no helm elements found in platform ApplicationSet"; exit 1; }
          while IFS=$'\t' read -r name chart repo version values ns; do
            echo "::group::helm template $name ($chart $version)"
            helm template "$name" "$chart" --repo "$repo" --version "$version" -n "$ns" -f "$values" > "/tmp/$name.rendered.yaml"
            kubeconform -strict -ignore-missing-schemas -summary "/tmp/$name.rendered.yaml"
            echo "::endgroup::"
          done < /tmp/charts.tsv
      - name: kustomize build (the overlays ArgoCD renders)
        run: |
          set -euo pipefail
          for k in platform/services/cluster-dashboard platform/services/litellm-sync platform/services/inference-gateway; do
            echo "::group::kustomize build $k"
            kustomize build "$k" > /dev/null
            echo "::endgroup::"
          done
      - name: kubeconform on plain manifests (KRO/CRD kinds skipped)
        # Validate raw K8s manifests against upstream schemas. -ignore-missing-schemas
        # lets custom kinds (kro.run, keda, GIE) through without a schema. Helm values
        # files and kustomizations are not manifests and are excluded.
        run: |
          set -euo pipefail
          find platform/config platform/services -name '*.yaml' \
            ! -name 'helm-values.yaml' ! -name 'kustomization.yaml' -print0 \
            | xargs -0 kubeconform -strict -ignore-missing-schemas -summary -skip "$KUBECONFORM_SKIP"

  renovate-config:
    name: renovate-config-validator
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: "44.169.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: validate renovate.json (strict)
        # Fails on unknown options, bad regex, or config needing migration — so a
        # broken renovate.json cannot silently stop the upgrade cycle.
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict renovate.json
