# Coverage guard: every pin on `main` is still detected by renovate.json.
#
# `main` has no Renovate annotations, so a renamed variable or a new pin location
# on `main` silently drops a component out of the update cycle. This runs the
# static coverage test against the current `main` weekly and on every push to
# this branch, and opens (or comments on) an issue when it fails.
name: coverage

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [lifecycle]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: Renovate detection covers main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out main into subject/
        uses: actions/checkout@v7
        with:
          ref: main
          path: subject
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest==8.3.3 pyyaml==6.0.2
      - name: Coverage test against main
        env:
          REQUIRE_SUBJECT: "1"
        run: python3 -m pytest -q tests/test_renovate_coverage.py tests/test_workflows.py::test_e2e_terraform_matches_the_subject_ci 2>&1 | tee coverage.log
      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Renovate coverage guard failing on main"
          main_sha="$(git -C subject rev-parse --short HEAD)"
          {
            echo "The coverage guard failed against \`main\` at ${main_sha}: a pin is no longer detected by renovate.json."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo '```'
            tail -n 60 coverage.log
            echo '```'
          } > body.md
          num="$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
